name: build-and-verify
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clean stale build output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force bin,obj -ErrorAction SilentlyContinue
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
      - name: Collect
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Get-ChildItem -Recurse -Directory -Filter publish | Where-Object { $_.FullName -like "*win-x64*" } | Select-Object -First 1
          if ($p) {
            New-Item -ItemType Directory -Force -Path dist | Out-Null
            Copy-Item (Join-Path $p.FullName '*') dist -Recurse -Force
            Remove-Item dist\*.zip -Force -ErrorAction SilentlyContinue
            Remove-Item dist\*.pdb -Force -ErrorAction SilentlyContinue
          }
      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZharikovApp-win-x64
          path: dist/**
          if-no-files-found: warn
      - name: Build GuardRunner
        run: dotnet build tools/GuardRunner/GuardRunner.csproj -c Release
      - name: Run vectors
        run: dotnet run --project tools/GuardRunner/GuardRunner.csproj -c Release -- Data/Blocks tools/baseline/control_vectors.json tools/baseline/_actual_vectors.json
      - name: Compare vectors
        if: always()
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python tools/guard_compare.py tools/baseline/control_vectors.json tools/baseline/_actual_vectors.json 2>&1 | Out-File -Encoding utf8 vector_compare.txt
          $c = $LASTEXITCODE
          Get-Content vector_compare.txt
          exit $c
      - name: Guard check
        if: always()
        shell: pwsh
        run: ./tools/guard_check.ps1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            vector_compare.txt
            docs/guard_report.md
            tools/baseline/_actual_vectors.json
          if-no-files-found: warn
