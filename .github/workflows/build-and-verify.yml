name: build-and-verify
on:
  push:
    branches: [ main, transfer-of-methodology-blocks-1888f ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        continue-on-error: true
        run: dotnet build -c Release

      - name: Publish self-contained
        continue-on-error: true
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Collect publish output
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Get-ChildItem -Recurse -Directory -Filter publish |
               Where-Object { $_.FullName -like "*win-x64*" } |
               Select-Object -First 1
          if (-not $p) {
            "publish folder not found" | Out-File -Encoding utf8 collect_error.txt
            exit 0
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path (Join-Path $p.FullName '*') -Destination dist -Recurse -Force
          Get-ChildItem dist | Select-Object Name, Length |
            Out-File -Encoding utf8 dist_listing.txt

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZharikovApp-win-x64
          path: dist/**
          if-no-files-found: warn

      - name: Independent data audit
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import json, glob, hashlib, os, traceback
          out = open("audit.txt", "w", encoding="utf-8")
          def log(*a):
              s = " ".join(str(x) for x in a)
              out.write(s + "\n")
              print(s)
          try:
              pf = "tools/baseline/protected_files.json"
              if os.path.exists(pf):
                  data = json.load(open(pf, encoding="utf-8-sig"))
                  for it in data.get("files", []):
                      p = it["path"]
                      if not os.path.exists(p):
                          log("MISSING", p)
                          continue
                      b = open(p, "rb").read()
                      raw = hashlib.sha256(b).hexdigest()
                      norm = hashlib.sha256(b.replace(b"\r\n", b"\n")).hexdigest()
                      exp = it["sha256"].lower()
                      state = "OK" if raw == exp else ("OK_AFTER_LF" if norm == exp else "MISMATCH")
                      log("HASH", state, p, "crlf" if b"\r\n" in b else "lf")
              for f in sorted(glob.glob("Data/Blocks/block_*.json")):
                  d = json.load(open(f, encoding="utf-8-sig"))
                  log("COUNT", os.path.basename(f), len(d.get("questions") or []))
          except Exception:
              log("FATAL", traceback.format_exc())
          out.close()

      - name: Build GuardRunner
        run: dotnet build tools/GuardRunner/GuardRunner.csproj -c Release

      - name: Run control vectors
        run: dotnet run --project tools/GuardRunner/GuardRunner.csproj -c Release -- Data/Blocks tools/baseline/control_vectors.json tools/baseline/_actual_vectors.json

      - name: Compare vectors
        shell: pwsh
        run: |
          python tools/guard_compare.py tools/baseline/control_vectors.json tools/baseline/_actual_vectors.json > vector_compare.txt 2>&1
          $code = $LASTEXITCODE
          Get-Content vector_compare.txt
          exit $code

      - name: Guard check
        shell: pwsh
        run: ./tools/guard_check.ps1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            audit.txt
            vector_compare.txt
            dist_listing.txt
            collect_error.txt
            docs/guard_report.md
            tools/baseline/_actual_vectors.json
          if-no-files-found: warn
